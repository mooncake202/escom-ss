services:
  mariadb:
    image: mariadb:10.11
    container_name: escom_mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: [SECRETO_ELIMINADO]
      MYSQL_DATABASE: escom_ss
      MYSQL_USER: escomuser
      MYSQL_PASSWORD: [SECRETO_ELIMINADO]
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p[SECRETO_ELIMINADO]"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    container_name: escom_redis
    restart: unless-stopped
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: node:20
    container_name: escom_backend
    working_dir: /app
    volumes:
      - ./:/app
      - /app/node_modules
      - /app/backend/node_modules
    command: sh -c "if [ ! -f node_modules/.install-stamp ] || [ package-lock.json -nt node_modules/.install-stamp ]; then npm install --no-audit --no-fund --prefer-offline && touch node_modules/.install-stamp; fi; npx prisma generate; cd backend; if [ ! -f node_modules/.install-stamp ] || [ package-lock.json -nt node_modules/.install-stamp ]; then npm install --no-audit --no-fund --prefer-offline && touch node_modules/.install-stamp; fi; npx nodemon server.js"
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "mysql://escomuser:[SECRETO_ELIMINADO]@mariadb:3306/escom_ss"
      JWT_SECRET: "[SECRETO_ELIMINADO]"
      JWT_EXPIRES_IN: "4h"
      REDIS_URL: "redis://redis:6379"
      FRONTEND_URL: "https://ttservicio.com"
      SMTP_HOST: "smtp.gmail.com"
      SMTP_PORT: "587"
      SMTP_USER: "karenlagarza02@gmail.com"
      SMTP_PASS: "[SECRETO_ELIMINADO]"
      SMTP_FROM: "Servicio Social IPN <karenlagarza02@gmail.com>"
      CORREO_DOMINIOS_EXTRA: "gmail.com"
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: escom_nginx
    volumes:
      - ./nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
      - ./front/dist:/usr/share/nginx/html:ro
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mariadb_data:
